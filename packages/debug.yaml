          tag: component
    turn_off_action:
      - logger.log:
          format: "Disabling verbose logging for: component"
          level: INFO
      - logger.set_level:
          level: ERROR # Reduced to ERROR only to minimize noise from blocking operations
          tag: component

  # [DEBUG] Verbose log toggle - tag: esp-idf
  - platform: template
    name: "Verbose: ESP-IDF Framework"
    id: verbose_esp_idf
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:bug-outline"
    web_server:
      sorting_group_id: sg_debug_logging
      sorting_weight: 100
    turn_on_action:
      - logger.log:
