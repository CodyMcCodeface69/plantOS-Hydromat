  # [DEBUG] Bypasses SafetyGate and HAL - hardware bring-up only
  - platform: template
    id: direct_gpio1_switch
    name: "Direct GPIO1 - Water Valve"
    optimistic: true
    restore_mode: ALWAYS_OFF
