          level: INFO
      - logger.set_level:
          level: DEBUG
          tag: esp-idf
    turn_off_action:
      - logger.log:
          format: "Disabling verbose logging for: esp-idf"
          level: INFO
      - logger.set_level:
          level: WARN
          tag: esp-idf

  # [DEBUG] Periodic system status reports in the log (60s interval)
  - platform: template
    name: "System Status Reports"
    id: enable_status_reports
    optimistic: true
    restore_mode: ALWAYS_OFF  # ~60-line burst every 60s; use "Print Status Report" for one-off dumps
    icon: "mdi:file-document-outline"
    web_server:
      sorting_group_id: sg_debug_logging
      sorting_weight: 110
    turn_on_action:
      - logger.log:
          format: "Enabling periodic system status reports"
          level: INFO
      - lambda: |-
          // Enable status reports with configured interval (60s) and verbose mode
          auto logger = id(unified_controller)->getStatusLogger();
          if (logger) {
            logger->configure(true, 60000, false);  // Use configured 60s interval
          }
    turn_off_action:
      - logger.log:
          format: "Disabling periodic system status reports"
          level: INFO
      - lambda: |-
          // Disable status reports
          auto logger = id(unified_controller)->getStatusLogger();
          if (logger) {
            logger->configure(false, 60000, false);
          }

