################################################################################
# PlantOS debug package
#
# Included from plantOS.yaml (packages: debug). Lists are appended to the
# matching sections of the main config. Keep production-relevant entities and
# anything referenced by core lambdas (e.g. on_boot) out of this file.
################################################################################

text_sensor:
  # [DEBUG] HAL mirror - duplicates the DS18B20 sensor value for HAL verification
  - platform: template
    name: "Water Temperature (HAL)"
    id: water_temperature_text
    web_server:
      sorting_group_id: sg_debug_hal
      sorting_weight: 10
    # Lambda returns current water temperature value from HAL
    lambda: |-
      if (id(hal)->hasTemperature()) {
        char buf[32];
        snprintf(buf, sizeof(buf), "%.1f°C", id(hal)->readTemperature());
        return {buf};
      } else {
        return {"N/A"};
      }
    # Update every 10 seconds to match sensor update interval
    update_interval: 10s

  # [DEBUG] HAL mirror - duplicates the BME280 temperature sensor value
  - platform: template
    name: "Air Temperature (HAL)"
    id: air_temperature_text
    web_server:
      sorting_group_id: sg_debug_hal
      sorting_weight: 20
    # Lambda returns current air temperature from BME280
    lambda: |-
      if (id(bme280_temperature).has_state()) {
        char buf[32];
        snprintf(buf, sizeof(buf), "%.1f°C", id(bme280_temperature).state);
        return {buf};
      } else {
        return {"N/A (BME280 offline)"};
      }
    # Update every 10 seconds to match sensor update interval
    update_interval: 10s

  # [DEBUG] HAL mirror - duplicates the BME280 humidity sensor value
  - platform: template
    name: "Air Humidity (HAL)"
    id: air_humidity_text
    web_server:
      sorting_group_id: sg_debug_hal
      sorting_weight: 30
    # Lambda returns current relative humidity from BME280
    lambda: |-
      if (id(bme280_humidity).has_state()) {
        char buf[32];
        snprintf(buf, sizeof(buf), "%.1f%%", id(bme280_humidity).state);
        return {buf};
      } else {
        return {"N/A (BME280 offline)"};
      }
    # Update every 10 seconds to match sensor update interval
    update_interval: 10s

  # [DEBUG] HAL mirror - duplicates the BME280 pressure sensor value
  - platform: template
    name: "Air Pressure (HAL)"
    id: air_pressure_text
    web_server:
      sorting_group_id: sg_debug_hal
      sorting_weight: 40
    # Lambda returns current barometric pressure from BME280
    lambda: |-
      if (id(bme280_pressure).has_state()) {
        char buf[32];
        snprintf(buf, sizeof(buf), "%.1f hPa", id(bme280_pressure).state);
        return {buf};
      } else {
        return {"N/A (BME280 offline)"};
      }
    # Update every 10 seconds to match sensor update interval
    update_interval: 10s

  # [DEBUG] HAL mirror - duplicates the EC sensor value read through the HAL
  - platform: template
    name: "EC (HAL)"
    id: ec_text
    web_server:
      sorting_group_id: sg_debug_hal
      sorting_weight: 50
    lambda: |-
      if (id(hal)->hasECValue()) {
        char buf[32];
        snprintf(buf, sizeof(buf), "%.0f uS/cm", id(hal)->readEC());
        return {buf};
      } else {
        return {"N/A"};
      }
    update_interval: 10s

button:
  # [DEBUG] One-off GPIO level dump (was a 30s interval)
  - platform: template
    name: "Log GPIO Levels"
    icon: "mdi:chip"
    web_server:
      sorting_group_id: sg_debug_gpio
      sorting_weight: 5
    on_press:
      - lambda: |-
          auto log_gpio = [](int pin, const char* name) {
            ESP_LOGI("gpio_status", "GPIO[%2d] %-24s| Level: %d", pin, name, gpio_get_level((gpio_num_t)pin));
          };
          ESP_LOGI("gpio_status", "=== GPIO Status Report ===");
          log_gpio(0,  "TDS/EC analog");
          log_gpio(1,  "Water Valve (MagValve)");
          log_gpio(3,  "DS18B20 water temp");
          log_gpio(4,  "Acid Pump (PP_1)");
          log_gpio(5,  "Grow (PP_2)");
          log_gpio(6,  "Micro (PP_3)");
          log_gpio(7,  "Bloom (PP_4)");
          log_gpio(8,  "System LED (WS2812)");
          log_gpio(17, "Water Level HIGH");
          log_gpio(18, "EZO pH UART TX");
          log_gpio(19, "EZO pH UART RX");
          log_gpio(20, "I2C SDA (BME280)");
          log_gpio(21, "I2C SCL (BME280)");
          log_gpio(22, "Water Level EMPTY");
          log_gpio(23, "Water Level LOW");

  # Air pump via Shelly Plus 4PM Socket 0
  - platform: template
    name: "Test Air Pump (5s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 160
    on_press:
      # Turn ON air pump via Shelly for 5 seconds
      # Tests HTTP communication and Shelly socket control
      then:
        - lambda: |-
            ESP_LOGI("button", "=== Air Pump Test (Shelly Socket 0) ===");
            ESP_LOGI("button", "Turning ON air pump for 5 seconds...");
        - switch.turn_on: air_pump_shelly_switch
        - delay: 5s
        - switch.turn_off: air_pump_shelly_switch
        - lambda: |-
            ESP_LOGI("button", "Air Pump OFF - 5s test complete");
            ESP_LOGI("button", "========================================");

  # Wastewater pump via Shelly Plus 4PM Socket 2
  - platform: template
    name: "Test Wastewater Pump (5s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 170
    on_press:
      # Turn ON wastewater pump via Shelly for 5 seconds
      # Tests HTTP communication and Shelly socket control
      then:
        - lambda: |-
            ESP_LOGI("button", "=== Wastewater Pump Test (Shelly Socket 2) ===");
            ESP_LOGI("button", "Turning ON wastewater pump for 5 seconds...");
        - switch.turn_on: wastewater_pump_shelly_switch
        - delay: 5s
        - switch.turn_off: wastewater_pump_shelly_switch
        - lambda: |-
            ESP_LOGI("button", "Wastewater Pump OFF - 5s test complete");
            ESP_LOGI("button", "==============================================");

  # Grow light via Shelly Plus 4PM Socket 3
  - platform: template
    name: "Test Grow Light (3s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 180
    on_press:
      # Turn ON grow light via Shelly for 3 seconds
      # Tests HTTP communication and Shelly socket control
      then:
        - lambda: |-
            ESP_LOGI("button", "=== Grow Light Test (Shelly Socket 3) ===");
            ESP_LOGI("button", "Turning ON grow light for 3 seconds...");
        - switch.turn_on: grow_light_shelly_switch
        - delay: 3s
        - switch.turn_off: grow_light_shelly_switch
        - lambda: |-
            ESP_LOGI("button", "Grow Light OFF - 3s test complete");
            ESP_LOGI("button", "=========================================");

switch:
  # === Verbose Logging Toggles ===
  # These switches control debug log output for specific components
  # Turning ON enables DEBUG level (verbose), turning OFF sets to INFO level (quiet)
  # Helps reduce log clutter during calibration and normal operation

  # [DEBUG] Master toggle for all per-component verbose switches
  - platform: template
    name: "Verbose: ALL"
    id: verbose_all
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:bug"
    web_server:
      sorting_group_id: sg_debug_logging
      sorting_weight: 10
    turn_on_action:
      - logger.log:
          format: "Enabling ALL verbose logging"
          level: WARN
      - switch.turn_on: verbose_sensor
      - switch.turn_on: verbose_text_sensor
      - switch.turn_on: verbose_ezo_ph
      - switch.turn_on: verbose_sensor_filter
      - switch.turn_on: verbose_dallas
      - switch.turn_on: verbose_controller
      - switch.turn_on: verbose_gpio_status
      - switch.turn_on: verbose_component
      - switch.turn_on: verbose_esp_idf
      - switch.turn_on: verbose_time
    turn_off_action:
      - logger.log:
          format: "Disabling ALL verbose logging"
          level: WARN
      - switch.turn_off: verbose_sensor
      - switch.turn_off: verbose_text_sensor
      - switch.turn_off: verbose_ezo_ph
      - switch.turn_off: verbose_sensor_filter
      - switch.turn_off: verbose_dallas
      - switch.turn_off: verbose_controller
      - switch.turn_off: verbose_gpio_status
      - switch.turn_off: verbose_component
      - switch.turn_off: verbose_esp_idf
      - switch.turn_off: verbose_time
# ==== Individual Verbose Logging Switches ====
# These switches control log output for specific components using logger.set_level action
# Turning ON enables DEBUG level (compile-time max), turning OFF sets to WARN level (quiet)
# See: https://esphome.io/components/logger/#loggerset_level-action

  # [DEBUG] Verbose log toggle - tag: sensor
  - platform: template
    name: "Verbose: Sensor State Updates"
    id: verbose_sensor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:bug-outline"
    web_server:
      sorting_group_id: sg_debug_logging
      sorting_weight: 20
    turn_on_action:
      - logger.log:
          format: "Enabling verbose logging for: sensor"
          level: INFO
      - logger.set_level:
          level: DEBUG
          tag: sensor
    turn_off_action:
      - logger.log:
          format: "Disabling verbose logging for: sensor"
          level: INFO
      - logger.set_level:
          level: WARN
          tag: sensor

  # [DEBUG] Verbose log toggle - tag: text_sensor
