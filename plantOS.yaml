################################################################################
switch:
  # === Air Pump Control ===
  - platform: template
    id: air_pump_cycling_switch
    name: "Air Pump Cycling"
    restore_mode: RESTORE_DEFAULT_OFF  # Default to Normal mode (24/7 ON)
    optimistic: true
    icon: "mdi:air-purifier"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 40
    turn_on_action:
      # Enable intermittent cycling for air pump
      # Uses periods configured via the "Air Pump ON/OFF Period" numbers
      # Starts with ON cycle immediately
      - lambda: |-
          uint32_t on_period = (uint32_t)id(air_pump_on_period).state;
          uint32_t off_period = (uint32_t)id(air_pump_off_period).state;

          ESP_LOGI("switch", "=== Air Pump Cycling ENABLED ===");
          ESP_LOGI("switch", "ON period: %u seconds", on_period);
          ESP_LOGI("switch", "OFF period: %u seconds", off_period);

          id(actuator_safety)->setCyclingPeriods("AirPump", on_period, off_period);
          id(actuator_safety)->enableCycling("AirPump", true);

          ESP_LOGI("switch", "Air pump will cycle: %us ON, %us OFF", on_period, off_period);
          ESP_LOGI("switch", "Starting with ON cycle");
          ESP_LOGI("switch", "================================");
    turn_off_action:
      # Disable intermittent cycling and enable Normal mode (24/7 ON)
      - lambda: |-
          ESP_LOGI("switch", "=== Air Pump: NORMAL MODE (24/7 ON) ===");
          id(actuator_safety)->enableCycling("AirPump", false);
          ESP_LOGI("switch", "Cycling disabled - air pump will run continuously");
          ESP_LOGI("switch", "Controller will turn ON pump within 30 seconds");
          ESP_LOGI("switch", "========================================");

  # === Safety Gate Control ===
  - platform: template
    id: safety_gate_enabled
    name: "Enable Actuator Safety Gate"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON  # Safety gate enabled by default
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 80
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "Actuator Safety Gate ENABLED");
          id(actuator_safety)->setEnabled(true);
    turn_off_action:
      - lambda: |-
          ESP_LOGW("switch", "Actuator Safety Gate DISABLED - manual control mode");
          id(actuator_safety)->setEnabled(false);

  # === Automatic EC/Feeding Control ===
  - platform: template
    id: auto_feeding_enabled_switch
    name: "Auto EC/Feeding Correction"
    icon: "mdi:flask-plus"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 120
    restore_mode: RESTORE_DEFAULT_ON  # Auto-feeding enabled by default
    optimistic: false  # State determined by lambda return value
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "====================================");
          ESP_LOGI("switch", "AUTO-FEEDING ENABLED");
          ESP_LOGI("switch", "====================================");
          ESP_LOGI("switch", "System will automatically trigger feeding when:");
          ESP_LOGI("switch", "  1. Water level reaches LOW (HIGH=OFF, LOW=OFF, EMPTY=ON)");
          ESP_LOGI("switch", "  2. Controller in IDLE state");
          ESP_LOGI("switch", "  3. NOT in NIGHT/SHUTDOWN/PAUSE/ERROR mode");
          ESP_LOGI("switch", "  4. Feeding not already triggered today");
          ESP_LOGI("switch", "====================================");

          // Save state to NVS
          id(psm).saveState("AutoFeedEnable", true);

          // Update controller state
          id(unified_controller).setAutoFeedingEnabled(true);
    turn_off_action:
      - lambda: |-
          ESP_LOGW("switch", "====================================");
          ESP_LOGW("switch", "AUTO-FEEDING DISABLED");
          ESP_LOGW("switch", "====================================");
          ESP_LOGW("switch", "Manual feeding only - no automatic triggers");
          ESP_LOGW("switch", "====================================");

          // Save state to NVS
          id(psm).saveState("AutoFeedEnable", false);

          // Update controller state
          id(unified_controller).setAutoFeedingEnabled(false);
    lambda: |-
      // Return cached value from controller (loaded from NVS at setup)
      // DO NOT call loadState() here - it allocates memory on each call!
      return id(unified_controller).isAutoFeedingEnabled();

  # === Automatic Weekly Reservoir Change Control ===
  - platform: template
    id: auto_reservoir_change_enabled_switch
    name: "Auto Reservoir Change"
    icon: "mdi:calendar-sync"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 90
    restore_mode: RESTORE_DEFAULT_OFF  # Disabled by default (manual control preferred)
    optimistic: false  # State determined by lambda return value
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "====================================");
          ESP_LOGI("switch", "AUTO RESERVOIR CHANGE ENABLED");
          ESP_LOGI("switch", "====================================");
          ESP_LOGI("switch", "System will automatically trigger reservoir change when:");
          ESP_LOGI("switch", "  1. Current day is the configured day of week");
          ESP_LOGI("switch", "  2. Controller in IDLE state");
          ESP_LOGI("switch", "  3. NOT in NIGHT/SHUTDOWN/PAUSE/ERROR mode");
          ESP_LOGI("switch", "  4. Reservoir change not already triggered this week");
          ESP_LOGI("switch", "====================================");

          // Save state to NVS
          id(psm).saveState("AutoResEnable", true);

          // Update controller state
          id(unified_controller).setAutoReservoirChangeEnabled(true);
    turn_off_action:
      - lambda: |-
          ESP_LOGW("switch", "====================================");
          ESP_LOGW("switch", "AUTO RESERVOIR CHANGE DISABLED");
          ESP_LOGW("switch", "====================================");
          ESP_LOGW("switch", "Manual reservoir change only - no automatic triggers");
          ESP_LOGW("switch", "====================================");

          // Save state to NVS
          id(psm).saveState("AutoResEnable", false);

          // Update controller state
          id(unified_controller).setAutoReservoirChangeEnabled(false);
    lambda: |-
      // Return cached value from controller (loaded from NVS at setup)
      return id(unified_controller).isAutoReservoirChangeEnabled();

  # === Auto pH Correction Toggle ===
  - platform: template
    id: auto_ph_correction_switch
    name: "Auto pH Correction"
    icon: "mdi:flask-outline"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 110
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: false
    turn_on_action:
      - lambda: |-
          id(unified_controller)->setAutoPhCorrectionEnabled(true);
          id(psm).saveState("AutoPHCorr", true);
          ESP_LOGI("switch", "Auto pH correction ENABLED");
    turn_off_action:
      - lambda: |-
          id(unified_controller)->setAutoPhCorrectionEnabled(false);
          id(psm).saveState("AutoPHCorr", false);
          ESP_LOGW("switch", "Auto pH correction DISABLED");
    lambda: |-
      return id(unified_controller)->isAutoPhCorrectionEnabled();

  # === Auto Water Level Toggle ===
  - platform: template
    id: auto_water_level_switch
    name: "Auto Water Level"
    icon: "mdi:water-auto"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 130
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: false
    turn_on_action:
      - lambda: |-
          id(unified_controller)->setAutoFillEnabled(true);
          id(psm).saveState("AutoFillEn", true);
          ESP_LOGI("switch", "Auto water level ENABLED");
    turn_off_action:
      - lambda: |-
          id(unified_controller)->setAutoFillEnabled(false);
          id(psm).saveState("AutoFillEn", false);
          ESP_LOGW("switch", "Auto water level DISABLED");
    lambda: |-
      return id(unified_controller)->isAutoFillEnabled();

  # === 10 - Actuator Control (Manual Toggle Switches via Safety Gate) ===
  # These switches toggle actuators through the safety gate for monitored control
  # Safety gate will auto-shutoff if max duration exceeded
  # Note: optimistic=true, switches show intended state (not actual hardware state)
  - platform: template
    id: mag_valve_switch
    name: "Magnetic Valve"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 10
    turn_on_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("WaterValve", true, 0)) {
            ESP_LOGW("switch", "Magnetic Valve: ON command REJECTED by safety gate");
          }
    turn_off_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("WaterValve", false)) {
            ESP_LOGW("switch", "Magnetic Valve: OFF command REJECTED by safety gate");
          }

  - platform: template
    id: pump_ph_switch
    name: "pH Pump"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 20
    turn_on_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("AcidPump", true, 0)) {
            ESP_LOGW("switch", "pH Pump: ON command REJECTED by safety gate");
          }
    turn_off_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("AcidPump", false)) {
            ESP_LOGW("switch", "pH Pump: OFF command REJECTED by safety gate");
          }

  # Nutrient Pump Switches (Grow = NutrientPumpA, Micro = NutrientPumpB, Bloom = NutrientPumpC)
  - platform: template
    id: pump_grow_switch
    name: "Grow Pump"    # NutrientPumpA → nutrient_A_ml_per_liter (GPIO5, PP_2)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 30
    turn_on_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpA", true, 0)) {
            ESP_LOGW("switch", "Grow Pump: ON command REJECTED by safety gate");
          }
    turn_off_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpA", false)) {
            ESP_LOGW("switch", "Grow Pump: OFF command REJECTED by safety gate");
          }

  - platform: template
    id: pump_micro_switch
    name: "Micro Pump"   # NutrientPumpB → nutrient_B_ml_per_liter (GPIO6, PP_3)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 40
    turn_on_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpB", true, 0)) {
            ESP_LOGW("switch", "Micro Pump: ON command REJECTED by safety gate");
          }
    turn_off_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpB", false)) {
            ESP_LOGW("switch", "Micro Pump: OFF command REJECTED by safety gate");
          }

  - platform: template
    id: pump_bloom_switch
    name: "Bloom Pump"   # NutrientPumpC → nutrient_C_ml_per_liter (GPIO7, PP_4)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 50
    turn_on_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpC", true, 0)) {
            ESP_LOGW("switch", "Bloom Pump: ON command REJECTED by safety gate");
          }
    turn_off_action:
      - lambda: |-
          if (!id(actuator_safety)->executeCommand("NutrientPumpC", false)) {
            ESP_LOGW("switch", "Bloom Pump: OFF command REJECTED by safety gate");
          }

  # Shelly integration on/off (runtime). OFF: no polling, Shelly commands dropped,
  # WastewaterPump forced OFF first; tank drain and reservoir change are refused.
  # Polling runs in a HAL worker task (every 30s), not in an interval.
  - platform: template
    name: "Shelly Integration"
    id: shelly_integration_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:power-socket-eu"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 5
    turn_on_action:
      - lambda: id(hal).setShellyEnabled(true);
    turn_off_action:
      - lambda: id(hal).setShellyEnabled(false);

  # === Shelly-Controlled Actuators (Shelly Plus 4PM @ 192.168.0.130) ===
  # AirPump on Socket 0, WastewaterPump on Socket 2, GrowLight on Socket 3
  # Socket 1 reserved for future expansion
  # Uses ASG for debouncing based on actual Shelly state (polled every 5s)

  # Air pump via Shelly Plus 4PM Socket 0
  - platform: template
    id: air_pump_shelly_switch
    name: "Air Pump"
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 60
    lambda: |-
      // Return actual state from HAL (synced via polling)
      return id(hal).getShellySwitchState(0);
    turn_on_action:
      # Use ASG for debouncing with actual Shelly state
      - lambda: |-
          if (id(actuator_safety).executeCommand("AirPump", true, 0)) {
            ESP_LOGI("switch", "Air Pump (Shelly Socket 0): ASG approved ON");
          } else {
            ESP_LOGD("switch", "Air Pump (Shelly Socket 0): ASG rejected (already ON or debounced)");
          }
    turn_off_action:
      - lambda: |-
          if (id(actuator_safety).executeCommand("AirPump", false, 0)) {
            ESP_LOGI("switch", "Air Pump (Shelly Socket 0): ASG approved OFF");
          } else {
            ESP_LOGD("switch", "Air Pump (Shelly Socket 0): ASG rejected (already OFF or debounced)");
          }

  # Wastewater pump via Shelly Plus 4PM Socket 2
  - platform: template
    id: wastewater_pump_shelly_switch
    name: "Wastewater Pump"
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 70
    lambda: |-
      // Return actual state from HAL (synced via polling)
      return id(hal).getShellySwitchState(2);
    turn_on_action:
      # Use ASG for debouncing with actual Shelly state
      - lambda: |-
          if (id(actuator_safety).executeCommand("WastewaterPump", true, 0)) {
