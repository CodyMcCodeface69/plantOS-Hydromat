    lambda: |-
      // Return actual state from HAL (synced via polling)
      return id(hal).getShellySwitchState(3);
    turn_on_action:
      # Use ASG for debouncing with actual Shelly state
      - lambda: |-
          if (id(actuator_safety).executeCommand("GrowLight", true, 0)) {
            ESP_LOGI("switch", "Grow Light (Shelly Socket 3): ASG approved ON");
          } else {
            ESP_LOGD("switch", "Grow Light (Shelly Socket 3): ASG rejected (already ON or debounced)");
          }
    turn_off_action:
      - lambda: |-
          if (id(actuator_safety).executeCommand("GrowLight", false, 0)) {
            ESP_LOGI("switch", "Grow Light (Shelly Socket 3): ASG approved OFF");
          } else {
            ESP_LOGD("switch", "Grow Light (Shelly Socket 3): ASG rejected (already OFF or debounced)");
          }

  # === pH Sensor Control ===
  - platform: template
    name: "Continuous pH Reading"
    id: continuous_ph_reading_switch
    optimistic: true
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 180
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("switch", "Enabling continuous pH reading mode");
            id(ezo_ph_uart_component)->enable_continuous_reading();
    turn_off_action:
      then:
        - lambda: |-
            ESP_LOGI("switch", "Disabling continuous pH reading mode");
            id(ezo_ph_uart_component)->disable_continuous_reading();

  # === Night Mode Configuration ===

  - platform: template
    name: "Night Mode"
    id: night_mode_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:weather-night"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 10
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "Night Mode ENABLED - no pH correction, feeding, or filling during night hours");
          id(unified_controller)->setNightModeConfig(true, id(night_start_hour).state, id(night_end_hour).state);
    turn_off_action:
      - lambda: |-
          ESP_LOGI("switch", "Night Mode DISABLED");
          id(unified_controller)->setNightModeConfig(false, id(night_start_hour).state, id(night_end_hour).state);

  # === Grow Light Schedule Control ===
  # When enabled, the controller will automatically control the grow light based on the calendar schedule.
  # When disabled (default), use Shelly scripts for direct light cycle control - more fail-proof.

  - platform: template
    name: "Grow Light Schedule"
    id: grow_light_schedule_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:lightbulb-auto"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 70
    turn_on_action:
      - lambda: |-
          ESP_LOGI("switch", "Grow Light Schedule ENABLED - controller will manage light based on calendar");
          id(unified_controller)->setGrowLightScheduleEnabled(true);
    turn_off_action:
      - lambda: |-
          ESP_LOGI("switch", "Grow Light Schedule DISABLED - use Shelly scripts for direct control");
          id(unified_controller)->setGrowLightScheduleEnabled(false);

number:
  # === EC Target Multiplier ===
  - platform: template
    id: ec_target_multiplier_slider
    name: "EC Target Multiplier"
    icon: "mdi:beaker-outline"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 140
    optimistic: true
    min_value: 0.1
    max_value: 2.0
    step: 0.05
    initial_value: 1.0
    restore_value: true
    unit_of_measurement: "x"
    mode: slider
    set_action:
      - lambda: |-
          ESP_LOGI("number", "EC target multiplier set to %.2fx", x);
          id(unified_controller)->setEcTargetMultiplier(x);

  # === EC Calibration Target ===
  - platform: template
    name: "EC Calibration Target"
    id: ec_calibration_target
    unit_of_measurement: "uS/cm"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 250
    min_value: 100
    max_value: 5000
    step: 1
    initial_value: 1413
    restore_value: false
    optimistic: true
    set_action:
      - lambda: id(unified_controller)->setEcCalibrationTarget(x);

  # === Night Mode Time Configuration ===
  - platform: template
    id: night_start_hour
    name: "Night Mode Start Hour"
    icon: "mdi:clock-start"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 20
    optimistic: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    restore_value: true
    unit_of_measurement: "h"
    mode: box
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Night Mode Start Hour set to %.0f:00", x);
          id(unified_controller)->setNightModeConfig(id(night_mode_switch).state, x, id(night_end_hour).state);

  - platform: template
    id: night_end_hour
    name: "Night Mode End Hour"
    icon: "mdi:clock-end"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 30
    optimistic: true
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 8
    restore_value: true
    unit_of_measurement: "h"
    mode: box
    set_action:
      - lambda: |-
          ESP_LOGI("number", "Night Mode End Hour set to %.0f:00", x);
          id(unified_controller)->setNightModeConfig(id(night_mode_switch).state, id(night_start_hour).state, x);

  # === Auto Reservoir Change Day of Week ===
  # Day of week: 0=Sunday ... 6=Saturday
  - platform: template
    id: auto_reservoir_change_day
    name: "Auto Reservoir Change Day"
    icon: "mdi:calendar-week"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 100
    optimistic: true
    min_value: 0
    max_value: 6
    step: 1
    initial_value: 0
    restore_value: true
    mode: box
    set_action:
      - lambda: |-
          const char* day_names[] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
          uint8_t day = (uint8_t)x;
          ESP_LOGI("number", "Auto Reservoir Change Day set to: %d (%s)", day, day_names[day]);
          id(unified_controller).setAutoReservoirChangeDay(day);

  # === pH K-Factor ===
  # Acid dose aggressiveness: dose = pH_delta x tank_L x K
  - platform: template
    id: ph_k_factor_slider
    name: "pH K-Factor"
    icon: "mdi:ph"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 150
    min_value: 0.01
    max_value: 5.00
    step: 0.005
    mode: slider
    optimistic: true
    initial_value: 0.25
    restore_value: true
    set_action:
      - lambda: 'id(unified_controller)->set_ph_k_factor(x);'
      - logger.log:
          format: "pH K-factor set to %.3f (dose = pH_delta x tank_L x K)"
          args: ['x']

  # === Mother Plant Mix Volume ===
  - platform: template
    id: mother_volume_liters
    name: "Mother Mix Volume"
    icon: "mdi:water-plus"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 170
    optimistic: true
    min_value: 1
    max_value: 15
    step: 0.5
    initial_value: 5
    restore_value: true
    unit_of_measurement: "L"
    mode: box
    set_action:
      - lambda: 'ESP_LOGI("number", "Mother mix volume set to %.1f L", x);'

  # === PWM Configuration Sliders ===
  # These sliders ONLY configure the pump duty cycle stored in the HAL pump
  # config; they do NOT activate the pump. The configured PWM is applied on
  # every controller activation and on the actuator test buttons. Direct GPIO
  # switches ignore this and always run at 100% for manual flushing.
  # The water valve (GPIO1) is binary (on/off), so it has no PWM slider.

  # [DEBUG] Pump PWM duty-cycle config - calibration/testing only
  - platform: template
    id: pwm_gpio4_slider
    name: "Acid Pump PWM"
    icon: "mdi:flask-percent"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 60
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - lambda: 'id(hal)->setPumpPwm("AcidPump", x / 100.0f);'
      - logger.log:
          format: "PWM config: AcidPump set to %.0f%% (not activated)"
          args: ['x']

  # [DEBUG] Pump PWM duty-cycle config - calibration/testing only
  - platform: template
    id: pwm_gpio5_slider
    name: "Grow Pump PWM"
    icon: "mdi:water-pump"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 70
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - lambda: 'id(hal)->setPumpPwm("NutrientPumpA", x / 100.0f);'
      - logger.log:
          format: "PWM config: NutrientPumpA set to %.0f%% (not activated)"
          args: ['x']

  # [DEBUG] Pump PWM duty-cycle config - calibration/testing only
  - platform: template
    id: pwm_gpio6_slider
    name: "Micro Pump PWM"
    icon: "mdi:water-pump"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 80
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - lambda: 'id(hal)->setPumpPwm("NutrientPumpB", x / 100.0f);'
      - logger.log:
          format: "PWM config: NutrientPumpB set to %.0f%% (not activated)"
          args: ['x']

  # [DEBUG] Pump PWM duty-cycle config - calibration/testing only
  - platform: template
    id: pwm_gpio7_slider
    name: "Bloom Pump PWM"
    icon: "mdi:water-pump"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 90
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - lambda: 'id(hal)->setPumpPwm("NutrientPumpC", x / 100.0f);'
      - logger.log:
          format: "PWM config: NutrientPumpC set to %.0f%% (not activated)"
          args: ['x']

  # === Air Pump Cycling Period Configuration ===
  - platform: template
    id: air_pump_on_period
    name: "Air Pump ON Period"
    icon: "mdi:timer-play-outline"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 50
    optimistic: true
    min_value: 10       # Minimum 10 seconds ON
    max_value: 3600     # Maximum 1 hour ON
    step: 10
    initial_value: 120  # Default: 2 minutes ON
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    set_action:
      - logger.log:
          format: "Air pump cycling ON period set to %u seconds"
          args: [ '(uint32_t)x' ]
          level: INFO

  - platform: template
    id: air_pump_off_period
    name: "Air Pump OFF Period"
    icon: "mdi:timer-stop-outline"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 60
    optimistic: true
    min_value: 10       # Minimum 10 seconds OFF
    max_value: 3600     # Maximum 1 hour OFF
    step: 10
    initial_value: 60   # Default: 1 minute OFF
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    set_action:
      - logger.log:
          format: "Air pump cycling OFF period set to %u seconds"
          args: [ '(uint32_t)x' ]
          level: INFO

################################################################################
# Intervals
################################################################################
interval:
  # Time-Series Vitals Publish - one JSON snapshot to plantos/vitals every 30s.
  # NaN-guards on numeric fields so a not-yet-read sensor never emits invalid JSON.
  # Telegraf on the broker host parses this into the InfluxDB "vitals" measurement.
  - interval: 30s
    then:
      - mqtt.publish_json:
          topic: plantos/vitals
          payload: |-
            if (!isnan(id(ph_sensor_real).state))     root["ph"]         = id(ph_sensor_real).state;
            if (!isnan(id(ec_sensor).state))          root["ec"]         = id(ec_sensor).state;
            if (!isnan(id(water_temperature).state))  root["water_temp"] = id(water_temperature).state;
            if (!isnan(id(bme280_temperature).state)) root["air_temp"]   = id(bme280_temperature).state;
            if (!isnan(id(bme280_humidity).state))    root["humidity"]   = id(bme280_humidity).state;
            if (!isnan(id(bme280_pressure).state))    root["pressure"]   = id(bme280_pressure).state;
            root["water_high"]  = id(water_level_high_sensor).state;
            root["water_low"]   = id(water_level_low_sensor).state;
            root["water_empty"] = id(water_level_empty_sensor).state;
