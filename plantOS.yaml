################################################################################
# PlantOS Hardware Configuration
#
# This file defines the complete hardware setup and component interconnections
# for the ESP32-C6 based plant monitoring system.
################################################################################

################################################################################
# Packages
#
# packages/debug.yaml holds debug-only entities (verbose log switches, GPIO bypass,
# HAL mirror text sensors, Shelly test buttons). They cost RAM, web UI sync time and
# MQTT topics just by existing, so production builds leave them out.
#
# The compile-time log level lives here too, as an inline package, because a package
# cannot override a key of the main file (the main file always wins), but a later
# package overrides an earlier one. Production compiles at INFO: ESP_LOGD/ESP_LOGV
# calls and their strings are not in the binary. The debug package raises it to DEBUG.
#
# Debug build: uncomment the `debug:` line below and build.
################################################################################
packages:
  log_level: {logger: {level: INFO}}
  # debug: !include packages/debug.yaml

esphome:
  name: plantos

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  # 8 MB flash, prepared but OFF. The board has 8 MB; the build uses ESPHome's 4 MB layout
  # (2 x 1792 KB app slots, nvs at 0x390000 / 436 KB). To switch, uncomment both lines:
  #  - Needs ONE flash over USB (`task flash`). An OTA cannot rewrite the partition table or the
  #    bootloader, so never OTA an 8 MB build onto a device that still has the 4 MB layout.
  #    After the switch every build must keep these lines; going back also needs USB.
  #  - partitions_8mb.csv keeps otadata, phy_init, app0 and nvs at today's offsets and sizes and
  #    grows both app slots to 3584 KB. The USB flash does not erase nvs, so grow day, pH K-factor,
  #    TDS/EC calibration, PSM state and restored entity values survive.
  #  - Without the `partitions:` line ESPHome generates 2 x 3840 KB app slots and moves nvs to
  #    0x790000: the device would then start with an EMPTY NVS (grow day 1, default K-factors,
  #    TDS/EC calibration and PSM state lost). Do not use flash_size alone.
  # flash_size: 8MB
  # partitions: partitions_8mb.csv
  framework:
    # ESP-IDF is chosen over Arduino for:
    # - Better RISC-V support on ESP32-C6 (newer chip architecture)
    # - More direct hardware access and lower-level control
    # - Better performance for real-time LED control (RMT peripheral)
    # - Official Espressif support and documentation
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # HTTP Connection Fix: Reduce TIME_WAIT socket exhaustion
      # Problem: Each HTTP request creates a TCP connection that enters TIME_WAIT for 120s
      # ESP32 lwIP has only 10 max sockets by default, causing ESP_ERR_HTTP_CONNECT errors
      # Solution: Reduce TCP_MSL from 60s to 5s (TIME_WAIT = 2×MSL = 10s instead of 120s)
      CONFIG_LWIP_TCP_MSL: "5000"        # 5s MSL = 10s TIME_WAIT (was 60s = 120s TIME_WAIT)
      CONFIG_LWIP_MAX_SOCKETS: "16"      # 16 sockets (was 10) for headroom
      # The ESPHome http_request component used to switch this off as a side effect. Nothing
      # references the ~60 KB CA bundle (MQTT brings its own CA, the Shelly calls are plain HTTP).
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: n

      # --- Flash diet: TLS (mbedTLS) -------------------------------------------------------
      # The only TLS user is the outbound MQTT connection (TLS 1.2 client, CA from secrets).
      # web_server, the native API and OTA do not use mbedTLS, so the TLS server role goes.
      CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT: n
      CONFIG_MBEDTLS_TLS_CLIENT_ONLY: y
      # Curves no public CA or broker uses. Still enabled: secp256r1, secp384r1, secp521r1
      # and Curve25519 (key exchange + ECDSA certificates; WPA3-SAE needs secp256r1).
      CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED: n
      CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED: n
      # Static-ECDH suites (fixed DH key in the certificate): obsolete, no server offers them.
      # Still enabled: ECDHE-ECDSA, ECDHE-RSA and plain RSA key exchange.
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA: n
      CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_RSA: n
      # The firmware only reads PEM certificates; it never writes PEM or parses CRLs/CSRs.
      CONFIG_MBEDTLS_PEM_WRITE_C: n
      CONFIG_MBEDTLS_X509_CRL_PARSE_C: n
      CONFIG_MBEDTLS_X509_CSR_PARSE_C: n

      # --- Flash diet: MQTT and WiFi features nothing uses ---------------------------------
      # MQTT runs over plain TLS (port 8883), never over WebSockets.
      CONFIG_MQTT_TRANSPORT_WEBSOCKET: n
      CONFIG_MQTT_TRANSPORT_WEBSOCKET_SECURE: n
      # WPA3-Personal (SAE) for the station stays on. Off: SAE-PK (public hotspots), SAE for
      # our own fallback AP (ESPHome starts it as WPA2), OWE (encrypted open networks) and
      # WPA-Enterprise (no eap: block in wifi:).
      CONFIG_ESP_WIFI_ENABLE_SAE_PK: n
      CONFIG_ESP_WIFI_SOFTAP_SAE_SUPPORT: n
      CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA: n
      CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT: n

      # --- Flash diet: silent assertions (~57 KB) -------------------------------------------
      # A failed assert() still aborts and reboots exactly as before; only the message text
      # (file, line, expression) is left out. The panic output keeps "abort() was called at
      # PC 0x..." and the backtrace: `task decode -- 0x...` turns those into file:line.
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE: n
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT: y

logger:
  # Compile-time level: INFO in production, DEBUG with the debug package. It is set in the
  # `packages:` block at the top of this file (not here, so the debug package can raise it).
  # ESP32-C6 uses built-in USB Serial/JTAG controller for logging
  # This must be explicitly configured or boot will hang
  hardware_uart: USB_SERIAL_JTAG

  # Per-tag limits below the global level. A tag cannot be more verbose than the
  # compile-time level; the DEBUG-era entries live in packages/debug.yaml.
  logs:
    adc: NONE              # Suppress ADC component messages
    sensor_filter: WARN    # Suppress sensor filter buffer logs
    plantos_hal: WARN      # Suppress HAL info logs
    component: ERROR       # Suppress component timing warnings
    time: WARN             # Suppress time synchronization logs
    wifi: WARN
    shelly_poll: WARN      # Suppress Shelly polling logs
    ledc.output: WARN      # Suppress LEDC output logs


wifi:
  # Credentials stored in secrets.yaml (gitignored) for security
  # This allows OTA updates and web interface access
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: !secret wifi_bssid  # Optional: Fix to specific AP for stability

  # Static IP configuration for consistent web UI access
  # Uncomment if you want a fixed IP address
  manual_ip:
    static_ip: 192.168.0.201
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    # DNS is REQUIRED with a static IP: setting manual_ip stops DHCP, so without
    # an explicit resolver the device has none (dns1 defaults to 0.0.0.0 = unset).
    # NTP pool hostnames then never resolve and the SNTP clock never syncs, even
    # though raw-IP traffic (Shelly, web UI, API) keeps working.
    dns1: 1.1.1.1     # router/gateway resolver
    dns2: 192.168.0.1         # public fallback

  # WiFi optimization for mesh networks (TP-Link Deco, etc.)
  # These settings improve compatibility with WiFi mesh systems
  # Mesh settings: Deactivate Fast Roaming and Beamforming, Deactivate Mesh for plantOS client, Deactivate 5 GHz band
  power_save_mode: none    # Disable power saving for better connectivity
  # fast_connect: true       # Skip channel scanning for faster connection

  # Force WiFi B/G mode by disabling 802.11n/ac features
  # This helps with mesh network compatibility and web server access
  # output_power: 8.5dB      # Lower output power for better mesh compatibility
  # enable_btm: false        # Disable 802.11v BSS Transition Management
  # enable_rrm: false        # Disable 802.11k Radio Resource Management

  # Reboot on connection failure after timeout
  # Helps recover from transient WiFi issues without manual intervention
  reboot_timeout: 2min

  # Put the IP address into the status report. (The air pump is NOT switched on here:
  # boot-time HTTP exhausted the sockets, so the Shelly air pump is left as it is.)
  on_connect:
    - lambda: id(unified_controller)->onWifiConnected(wifi::global_wifi_component->get_ip_addresses()[0].str());

  # ==============================================================
  # FALLBACK ACCESS POINT (AP) FOR DEBUGGING
  # IMPORTANT: If the device cannot connect to the main WiFi network,
  # it creates this temporary WiFi network. Connect to it to view
  # live logs in your browser at http://192.168.4.1
  # ==============================================================
  ap:
    ssid: "PlantOS-Fallback"
    password: "debug123"
ota:
  # ESPHome OTA allows firmware updates over WiFi without USB cable
  # Critical for deployed devices in hard-to-reach locations (e.g., greenhouse)
  - platform: esphome

web_server:
  # Provides real-time sensor data and component control via browser
  # Accessible at device IP on port 80 (standard HTTP)
  # Useful for debugging and monitoring without serial connection
  version: 3
  port: 80
  # local: embed the frontend that ships with this ESPHome version (2025.4.2).
  # The default js_url (https://oi.esphome.io/v3/www.js) always serves the LATEST
  # frontend, which expects a `domain` field in SSE state events that 2025.4 doesn't
  # send. It then ignores an entity until it has seen 3 state events, so buttons,
  # switches and numbers (one event each) never appeared. Drop this after an ESPHome upgrade
  # only if the remote frontend matches the firmware again.
  local: true
  # UI categories - every entity is assigned via web_server.sorting_group_id.
  # Lower sorting_weight appears first. Debug groups sit at the bottom.
  sorting_groups:
    - id: sg_status
      name: "Status"
      sorting_weight: 10
    - id: sg_sensors
      name: "Sensors"
      sorting_weight: 20
    - id: sg_controller_actions
      name: "Controller"
      sorting_weight: 30
    - id: sg_controller_settings
      name: "Controller Settings"
      sorting_weight: 40
    - id: sg_calendar
      name: "Calendar"
      sorting_weight: 50
    - id: sg_actuators
      name: "Actuators"
      sorting_weight: 60
    - id: sg_system
      name: "System"
      sorting_weight: 70
    - id: sg_debug_logging
      name: "Debug: Logging"
      sorting_weight: 80
    - id: sg_debug_gpio
      name: "Debug: GPIO Bypass & PWM"
      sorting_weight: 90
    - id: sg_debug_hal
      name: "Debug: HAL Mirrors"
      sorting_weight: 100

# API for Home Assistant integration and external service calls
# reboot_timeout: 0s disables the "no API client connected" reboot behavior
# (web UI uses HTTP on port 80, not the ESPHome API)
api:
  reboot_timeout: 0s

################################################################################
# MQTT - Time-Series Vitals Logging
#
# Publishes a clean JSON snapshot of all vitals (pH, EC, temps, water levels) to
# `plantos/vitals` every 30s for off-device, long-term storage. Coexists with the
# native `api:` above (both stay enabled) so OTA, web UI, and Home Assistant keep
# working unchanged. Broker lives on Hetzner; the ESP32 connects OUTBOUND over TLS,
# so no inbound ports need to be opened on the home router.
#
# `discovery: false` because consumers (Telegraf) read the raw `plantos/vitals`
# topic, not Home Assistant MQTT discovery. Flip to true later if HA is added.
# `reboot_timeout: 0s` keeps the device running normally if the broker is down.
################################################################################
mqtt:
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: plantos
  discovery: false
  reboot_timeout: 0s
  certificate_authority: !secret mqtt_ca_cert

################################################################################
# Time Synchronization: NTP
#
# Synchronizes the ESP32's system time with Network Time Protocol (NTP) servers.
# This enables accurate timestamping for logs, sensor data, and scheduled actions.
################################################################################
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"
    update_interval: 60s
    on_time_sync:
      then:
        - logger.log:
            level: WARN
            format: "NTP sync OK: time is now valid"

external_components:
  # Points to local custom components directory
  # ESPHome will compile and link C++ code from here alongside generated code
  - source: components
    components: [sensor_filter, ezo_ph_uart,
                 actuator_safety_gate, calendar_manager, persistent_state_manager,
                 i2c_scanner, wdt_manager, plantos_hal,
                 plantos_controller, tds_sensor, alert_service]
  # ADC fix for ESP32-C6 (oneshot API - built-in ADC doesn't compile on C6)
  # Ref: https://github.com/esphome/issues/issues/5363
  - source:
      type: git
      url: https://github.com/leon-v/esphome
      ref: adc_one_shot_C2
    components: [adc]
    refresh: 0s

# I²C Buses - Requires 4.7kΩ external pull-ups to 3.3V on each bus
i2c:
  - id: i2c_bus
    sda: GPIO20  # BME280 air temperature sensor
    scl: GPIO21
    scan: false  # Disable ESPHome's automatic scan (we use our custom scanner)
    frequency: 100kHz

# UART for EZO pH sensor - TX: GPIO18, RX: GPIO19, 9600 baud
uart:
  id: uart_bus
  tx_pin: GPIO18  # ESP32-C6 TX → EZO RX
  rx_pin: GPIO19  # ESP32-C6 RX ← EZO TX
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

# I²C Scanner - validates critical devices at boot and periodically
i2c_scanner:
  - id: my_i2c_scanner
    i2c_id: i2c_bus
    scan_on_boot: true
    scan_interval: 60s
    verbose: false
    status_logger: unified_controller
    critical_devices:
      - address: 0x76
        name: "BME280 Air Sensor"


################################################################################
# Visual Feedback: WS2812 RGB LED
#
# The built-in LED serves as the primary user interface, displaying system
# state via color and animation patterns controlled by the FSM.
################################################################################
light:
  - platform: esp32_rmt_led_strip
    # ESP32-C6-DevKitC-1 has a WS2812 RGB LED hard-wired to GPIO 8
    pin: 8
    num_leds: 1
    rgb_order: RGB
    name: "Built-in LED"
    id: system_led
    chipset: WS2812
    # internal: the FSM animates this LED; publishing every frame flooded the web UI (SSE),
    # MQTT and API. The HAL also throttles updates (ESPHomeHAL::setSystemLED).
    internal: true

    # default_transition_length: 0s disables automatic color smoothing
    # WHY: The FSM controller implements its own timing and animations
    # (breathing effect, blinking). ESPHome's built-in transitions would
    # interfere with precise FSM-driven visual feedback, creating lag or
    # blending between states. Instant transitions give the controller
    # full control over every frame.
    default_transition_length: 0s

################################################################################
# PWM Outputs: Actuator Control via Logic Level MOSFETs
#
# Five actuators controlled by 3.3V logic level MOSFETs with PWM support:
# - GPIO1: Magnetic Valve (fresh water inlet) - MagValve on PCB
# - GPIO4: pH Pump (acid dosing for pH down) - PP_1 on PCB
# - GPIO5: Grow Pump (grow phase nutrients)  - PP_2 on PCB → HAL: NutrientPumpA → Calendar: nutrient_A_ml_per_liter
# - GPIO6: Micro Pump (micronutrients)       - PP_3 on PCB → HAL: NutrientPumpB → Calendar: nutrient_B_ml_per_liter
# - GPIO7: Bloom Pump (bloom phase nutrients)- PP_4 on PCB → HAL: NutrientPumpC → Calendar: nutrient_C_ml_per_liter
#
# Using LEDC (LED PWM Controller) for both on/off and PWM control
# Frequency: 1000 Hz (1 kHz) - suitable for most pumps and valves
# All outputs are active HIGH (3.3V = ON/OPEN, 0V = OFF/CLOSED)
################################################################################
output:
  - platform: ledc
    id: mag_valve_output
    pin: GPIO1
    frequency: 1000 Hz
    zero_means_zero: true  # 0% duty cycle = truly off

  - platform: ledc
    id: pump_ph_output
    pin: GPIO4
    frequency: 1000 Hz
    zero_means_zero: true

  - platform: ledc
    id: pump_grow_output
    pin: GPIO5
    frequency: 1000 Hz
    zero_means_zero: true

  - platform: ledc
    id: pump_micro_output
    pin: GPIO6
    frequency: 1000 Hz
    zero_means_zero: true

  - platform: ledc
    id: pump_bloom_output
    pin: GPIO7
    frequency: 1000 Hz
    zero_means_zero: true

  # NOTE: The wastewater pump has no GPIO output. It runs on Shelly Plus 4PM socket 2 (HTTP).

################################################################################
# 1-Wire Bus: For DS18B20 Temperature Sensor
#
# DS18B20 is a digital temperature sensor that uses the 1-Wire protocol.
# Only requires a single data line plus ground (can parasitic power from data).
# Requires 4.7kΩ pull-up resistor between data line and 3.3V.
#
# GPIO3 - WTR_TEMP on PCB
# Wastewater pump now controlled via Shelly Plus 4PM Socket 2 (HTTP control).
# AirPump actuator now controlled via Shelly Plus 4PM Socket 0 (HTTP control).
################################################################################
one_wire:
  - platform: gpio
    pin: GPIO3
    id: one_wire_bus

# Sensor Configuration
sensor:
  # Temperature Sensor: DS18B20 Digital Temperature Sensor
  #
  # DS18B20 is a 1-Wire digital temperature sensor providing accurate readings
  # from -55°C to +125°C with ±0.5°C accuracy between -10°C and +85°C.
  # Connected to GPIO3 (WTR_TEMP on PCB) via one_wire bus.
  #
  # HARDWARE: Requires 4.7kΩ pull-up resistor between data line (GPIO3) and 3.3V
  # WIRING:
  #   - Red wire (VCC) -> 3.3V
  #   - Black wire (GND) -> GND
  #   - Yellow wire (DATA) -> GPIO3 (with 4.7kΩ pull-up to 3.3V)
  - platform: dallas_temp
    one_wire_id: one_wire_bus
    id: water_temperature
    name: "Water Temperature"
    update_interval: 60s     # Update temperature every 60 seconds
    accuracy_decimals: 2     # Display 2 decimal places (e.g., 24.50°C)
    resolution: 12           # 12-bit resolution (0.0625°C per bit, ~750ms conversion)
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 30

  # Environmental Sensor: BME280 Temperature/Humidity/Pressure Sensor
  #
  # BME280 is a combined environmental sensor providing:
  # - Temperature: -40°C to +85°C (±1°C accuracy)
  # - Humidity: 0-100% RH (±3% accuracy)
  # - Pressure: 300-1100 hPa (±1 hPa accuracy)
  #
  # Connected via I²C bus (GPIO20=SDA, GPIO21=SCL) at address 0x76 or 0x77
  # AIR_TEMP on PCB
  #
  # HARDWARE: Requires 4.7kΩ pull-up resistors on SDA/SCL to 3.3V (already present on I²C bus)
  # WIRING:
  #   - VCC -> 3.3V
  #   - GND -> GND
  #   - SDA -> GPIO20 (I²C SDA with 4.7kΩ pull-up)
  #   - SCL -> GPIO21 (I²C SCL with 4.7kΩ pull-up)
  #
  # NOTE: This sensor is non-critical - system operates normally if not present
  # FIXED: Changed platform from 'bme280' to 'bme280_i2c' (ESPHome 2024.2.0+ requirement)
  - platform: bme280_i2c
    i2c_id: i2c_bus
    address: 0x76           # Default address (some modules use 0x77)
    update_interval: 60s    # Update environmental data every 60 seconds

    temperature:
      id: bme280_temperature
      name: "Air Temperature"
      accuracy_decimals: 1
      oversampling: 16x     # High oversampling for accuracy
      web_server:
        sorting_group_id: sg_sensors
        sorting_weight: 60

    humidity:
      id: bme280_humidity
      name: "Air Humidity"
      accuracy_decimals: 1
      oversampling: 16x
      web_server:
        sorting_group_id: sg_sensors
        sorting_weight: 70

    pressure:
      id: bme280_pressure
      name: "Air Pressure"
      accuracy_decimals: 1
      oversampling: 16x
      web_server:
        sorting_group_id: sg_sensors
        sorting_weight: 80

  # TDS/EC Sensor: KS0429 TDS Meter V1.0 via ADC
  #
  # Reads water conductivity (EC) for nutrient monitoring.
  # Uses leon-v ADC fork for ESP32-C6 compatibility (oneshot API).
  # Signal chain: ADC voltage → tds_sensor (median filter + temp comp + polynomial) → EC (uS/cm)
  #
  # HARDWARE: KS0429 TDS Meter V1.0
  #   - VCC -> 3.3V (supports 3.3-5.5V)
  #   - GND -> GND
  #   - Signal -> GPIO0 (ADC1_CH0)
  #   - Output range: 0-2.3V (0-1000ppm TDS)
  - platform: adc
    id: tds_adc_raw
    pin: GPIO0
    name: "TDS ADC Raw Voltage"
    internal: true
    update_interval: 100ms
    samples: 5

  # TDS Sensor: Median filter + temperature compensation + KS0429 polynomial
  # Converts raw ADC voltage to EC (uS/cm)
  # EC (uS/cm) = 133.42*V^3 - 255.86*V^2 + 857.39*V (compensated for temperature)
  - platform: tds_sensor
    id: ec_sensor
    name: "EC"
    sensor_source: tds_adc_raw
    temperature_sensor: water_temperature
    sample_count: 30
    default_temperature: 25.0
    update_interval: 5s
    accuracy_decimals: 1
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 40

  # Sensor Filter: Robust Averaging with Outlier Rejection
  #
  # Filters the raw sensor data using robust averaging to reject outliers.
  # This improves data quality by removing sensor spikes, noise, and glitches.
  - id: sensor_filtered_id
    platform: sensor_filter
    name: "Filtered pH"
    accuracy_decimals: 3  # Display 3 decimal places (e.g., 2.936)
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 20

    # sensor_source: The raw sensor to filter
    sensor_source: ph_sensor_real

    # window_size: Number of readings to collect before calculating average
    # 5 readings = faster first result (5 minutes with 60s update interval)
    # Note: EZO pH sensor already has sliding_window_moving_average filter
    window_size: 5

    # reject_percentage: Percentage to reject from each end (0.0 to 0.5)
    # 0.10 = reject 10% lowest + 10% highest = 20% total outlier rejection
    # With 5 readings: rejects 0.5 from each end (rounds to nearest)
    reject_percentage: 0.10


  # Live EMA-adapted K-factor used by the acid dosing formula
  - platform: template
    name: "pH K-Factor (live)"
    id: ph_k_factor_sensor
    icon: "mdi:ph"
    accuracy_decimals: 4
    update_interval: 30s
    lambda: 'return id(unified_controller)->get_ph_k_factor();'
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 160

################################################################################
# Binary Sensors: Water Level Sensors (XKC-Y23-V)
#
# Three capacitive non-contact water level sensors for tank monitoring and
# automatic feeding:
# - HIGH sensor (GPIO17): Tank full indicator - WTR_HI on PCB
# - LOW sensor (GPIO23): Auto-feed trigger level - WTR_LO on PCB
# - EMPTY sensor (GPIO22): Minimum safe level (prevents pump dry-running) - WTR_Empty on PCB
#
# 5 Tank States (3-Sensor System):
# - HIGH=ON, LOW=ON:         FULL (above HIGH)
# - HIGH=OFF, LOW=ON:        NORMAL (between HIGH and LOW)
# - HIGH=OFF, LOW=OFF, EMPTY=ON:  LOW (auto-feed trigger zone ⚡)
# - HIGH=OFF, LOW=OFF, EMPTY=OFF: EMPTY (danger - below safe level ⚠️)
# - HIGH=ON, LOW=OFF:        ERROR (invalid - check wiring)
################################################################################
binary_sensor:
  # XKC-Y23-V Water Level HIGH Sensor (GPIO17 - WTR_HI)
  # Triggers when water reaches high level (tank near full)
  - platform: gpio
    id: water_level_high_sensor
    name: "Water Level HIGH"
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 90
    pin:
      number: GPIO17
      mode:
        input: true
        pulldown: true  # Pull down when sensor not active
    filters:
      # Debounce: sensor must be stable for 500ms to prevent water ripple false triggers
      - delayed_on: 500ms
      - delayed_off: 500ms

  # XKC-Y23-V Water Level LOW Sensor (GPIO23 - WTR_LO)
  # Triggers when water reaches auto-feed trigger level (moved up from original position)
  # When OFF (with EMPTY=ON), triggers automatic feeding once per day
  - platform: gpio
    id: water_level_low_sensor
    name: "Water Level LOW"
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 100
    pin:
      number: GPIO23
      mode:
        input: true
        pulldown: true  # Pull down when sensor not active
    filters:
      # Debounce: sensor must be stable for 500ms to prevent water ripple false triggers
      - delayed_on: 500ms
      - delayed_off: 500ms

  # XKC-Y23-V Water Level EMPTY Sensor (GPIO22 - WTR_Empty)
  # Triggers when water is at absolute minimum safe level
  # Prevents pump dry-running during drain operations
  - platform: gpio
    id: water_level_empty_sensor
    name: "Water Level EMPTY"
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 110
    pin:
      number: GPIO22
      mode:
        input: true
        pulldown: true  # Pull down when sensor not active
    filters:
      # Debounce: sensor must be stable for 500ms to prevent water ripple false triggers
      - delayed_on: 500ms
      - delayed_off: 500ms


################################################################################
# Text Sensor: Controller State (00 - Kern-Status)
#
# Publishes the current unified controller FSM state to the web UI.
# Shows state names: INIT, IDLE, SHUTDOWN, PAUSE, ERROR, PH_MEASURING,
#                    PH_CALCULATING, PH_INJECTING, PH_MIXING, PH_CALIBRATING,
#                    FEEDING, WATER_FILLING, WATER_EMPTYING
################################################################################
text_sensor:
  - platform: template
    name: "Controller State"
    id: controller_state_text
    # Lambda returns current controller state as string
    lambda: |-
      return id(unified_controller)->getStateAsString();
    # Update every 5s to show real-time state changes
    update_interval: 5s
    web_server:
      sorting_group_id: sg_status
      sorting_weight: 10

  - platform: template
    name: "Alert State"
    id: alert_state_text
    # Lambda returns current alert state in short form (Clear, pH Critical, etc.)
    lambda: |-
      return id(unified_controller)->getStatusLogger()->getAlertStateShort();
    # Update every 5s to show real-time alert changes
    update_interval: 5s
    web_server:
      sorting_group_id: sg_status
      sorting_weight: 20

  - platform: template
    name: "Uptime"
    id: uptime_text
    web_server:
      sorting_group_id: sg_status
      sorting_weight: 40
    lambda: return id(unified_controller)->uptimeText();
    update_interval: 1s

  # TDS in ppm derived from EC (EC * 0.5) - only exists as this text sensor
  - platform: template
    name: "TDS"
    id: tds_ppm_text
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 50
    lambda: return id(unified_controller)->tdsText();
    update_interval: 10s

  - platform: template
    name: "Tank Volume"
    id: tank_volume_text
    web_server:
      sorting_group_id: sg_status
      sorting_weight: 50
    # Configured tank volumes from the HAL: delta LOW->HIGH (feeding), total EMPTY->HIGH (reservoir change)
    lambda: return id(unified_controller)->tankVolumeText();
    # Update every 60 seconds (static configuration value)
    update_interval: 60s

  - platform: template
    name: "Current Time"
    id: current_time_text
    web_server:
      sorting_group_id: sg_status
      sorting_weight: 30
    # Local time from SNTP, "Not initialized" until the first sync
    lambda: return id(unified_controller)->currentTimeText();
    # Update every 1 second to show real-time clock
    update_interval: 1s

  - platform: template
    name: "Current Grow Day"
    id: current_grow_day_text
    web_server:
      sorting_group_id: sg_calendar
      sorting_weight: 10
    # Current grow day from the calendar manager
    lambda: return id(unified_controller)->growDayText();
    # Update every 60 seconds
    update_interval: 60s

################################################################################
# Button: Controller Management and Manual Routines
#
# Provides manual control over the system controller and PlantOS routines.
################################################################################
button:
  # === System Control & Restart ===
  - platform: restart
    name: "Reboot Device"
    id: restart_button
    web_server:
      sorting_group_id: sg_system
      sorting_weight: 10

  - platform: template
    name: "Set to INIT"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 40
    on_press:
      - lambda: id(unified_controller)->resetToInit();

  # === Operation Sequences ===
  # State: FEEDING
  - platform: template
    name: "Add Nutrients"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 50
    on_press:
      - lambda: id(unified_controller)->startFeeding();

  # States: WATER_FILLING -> PH_PROCESSING
  - platform: template
    name: "Fill Tank"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 60
    on_press:
      - lambda: id(unified_controller)->startFillTank();

  # State: WATER_EMPTYING
  - platform: template
    name: "Empty Tank"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 70
    on_press:
      - lambda: id(unified_controller)->startEmptyTank();

  # States: FEED_FILLING -> FEEDING -> PH_PROCESSING
  - platform: template
    name: "Feed"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 80
    on_press:
      - lambda: id(unified_controller)->startFeed();

  # States: WATER_EMPTYING -> FEED_FILLING -> FEEDING -> PH_PROCESSING
  - platform: template
    name: "Reservoir Change"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 90
    on_press:
      - lambda: id(unified_controller)->startReservoirChange();

  - platform: template
    name: "Print Status Report"
    icon: "mdi:file-document-outline"
    web_server:
      sorting_group_id: sg_system
      sorting_weight: 15
    on_press:
      - lambda: id(unified_controller)->requestStatusReport();

  - platform: template
    name: "Reconnect WiFi"
    web_server:
      sorting_group_id: sg_system
      sorting_weight: 20
    on_press:
      # Force WiFi to disconnect and reconnect (mesh network troubleshooting)
      - wifi.disable:
      - delay: 2s
      - wifi.enable:

  # === System State Control ===
  # All actuators OFF, calendar disabled
  - platform: template
    name: "Set to SHUTDOWN"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 10
    on_press:
      - lambda: id(unified_controller)->setToShutdown();

  # Actuator states kept, calendar disabled
  - platform: template
    name: "Set to PAUSE"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 20
    on_press:
      - lambda: id(unified_controller)->setToPause();

  - platform: template
    name: "Set to IDLE"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 30
    on_press:
      - lambda: id(unified_controller)->setToIdle();

  # === Operations & Override ===
  # States: EC_PROCESSING -> EC_CALCULATING -> EC_FEEDING -> EC_MIXING -> EC_MEASURING -> PH_PROCESSING
  - platform: template
    name: "EC Correction"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 100
    on_press:
      - lambda: id(unified_controller)->startEcCheck();

  # All pumps OFF immediately, then SHUTDOWN
  - platform: template
    name: "Emergency Stop"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 110
    on_press:
      - lambda: id(unified_controller)->emergencyStop();

  # Nutrient mix for the mother plant, volume set via "Mother Mix Volume"
  - platform: template
    name: "Mother Plant Nutrients"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 120
    on_press:
      - lambda: id(unified_controller)->startMotherNutrients(id(mother_volume_liters).state);

  # === Logging & Cleanup ===
  - platform: template
    name: "Clear PSM Alerts"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 140
    on_press:
      - lambda: id(psm)->clearEvent();

  # === Time & NTP ===
  - platform: template
    name: "Force NTP Sync"
    web_server:
      sorting_group_id: sg_system
      sorting_weight: 40
    on_press:
      - lambda: id(unified_controller)->forceTimeSync();

  # === pH & Measurement ===
  - platform: template
    name: "Start pH Calibration"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 200
    on_press:
      - lambda: id(unified_controller)->startPhCalibration();

  - platform: template
    name: "Start pH Correction"
    web_server:
      sorting_group_id: sg_controller_actions
      sorting_weight: 130
    on_press:
      - lambda: id(unified_controller)->startPhCorrection();

  # === pH Temperature Compensation ===
  - platform: template
    name: "pH Temp Compensation (Auto)"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 220
    on_press:
      - lambda: id(unified_controller)->sendPhTempCompensationFromSensor();

  - platform: template
    name: "pH Temp Compensation (Manual)"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 230
    on_press:
      # Fixed 19.5 °C, for testing or when the temperature sensor fails
      - lambda: id(unified_controller)->sendPhTempCompensation(19.5f);

  - platform: template
    name: "Check pH Calibration Status"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 210
    on_press:
      - lambda: id(hal)->queryPhCalibrationStatus();

  # === EC Calibration ===
  - platform: template
    name: "Start EC Calibration"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 240
    on_press:
      - lambda: id(unified_controller)->startEcCalibration(id(ec_calibration_target).state);

  # Resets the EC calibration factor back to 1.0
  - platform: template
    name: "Reset EC Calibration"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 260
    on_press:
      then:
        - lambda: id(unified_controller)->resetEcCalibration();

  # === Actuator Timed Tests ===
  - platform: template
    name: "Test Magnetic Valve (3s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 110
    on_press:
      - lambda: id(unified_controller)->startValveTest();

  - platform: template
    name: "Test pH Pump (10s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 120
    on_press:
      - lambda: id(unified_controller)->startPumpTest("AcidPump");

  - platform: template
    name: "Test Grow Pump (10s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 130
    on_press:
      - lambda: id(unified_controller)->startPumpTest("NutrientPumpA");

  - platform: template
    name: "Test Micro Pump (10s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 140
    on_press:
      - lambda: id(unified_controller)->startPumpTest("NutrientPumpB");

  - platform: template
    name: "Test Bloom Pump (10s)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 150
    on_press:
      - lambda: id(unified_controller)->startPumpTest("NutrientPumpC");

  # === Precision Dosing Tests (2cl/20mL) ===
  - platform: template
    name: "Test Grow Pump (2cl = 20mL)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 210
    on_press:
      - lambda: id(unified_controller)->startPumpDoseTest("NutrientPumpA", 20.0f);

  - platform: template
    name: "Test pH Pump (2cl = 20mL)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 220
    on_press:
      - lambda: id(unified_controller)->startPumpDoseTest("AcidPump", 20.0f);

  - platform: template
    name: "Test Micro Pump (2cl = 20mL)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 230
    on_press:
      - lambda: id(unified_controller)->startPumpDoseTest("NutrientPumpB", 20.0f);

  - platform: template
    name: "Test Bloom Pump (2cl = 20mL)"
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 240
    on_press:
      - lambda: id(unified_controller)->startPumpDoseTest("NutrientPumpC", 20.0f);

  # === Calendar Day Control ===
  - platform: template
    name: "Calendar Day +1"
    web_server:
      sorting_group_id: sg_calendar
      sorting_weight: 20
    on_press:
      - lambda: id(unified_controller)->changeGrowDay(+1);
      - component.update: current_grow_day_text

  - platform: template
    name: "Calendar Day -1"
    web_server:
      sorting_group_id: sg_calendar
      sorting_weight: 30
    on_press:
      - lambda: id(unified_controller)->changeGrowDay(-1);
      - component.update: current_grow_day_text

################################################################################
# PlantOS HAL (Hardware Abstraction Layer) - Layer 3
#
# Provides platform-agnostic hardware interface for the unified Controller.
# Phase 2 implementation - hardware actuators connected.
################################################################################
plantos_hal:
  id: hal
  system_led: system_led
  ph_sensor: ph_sensor_real  # Real EZO pH UART sensor with filtering
  ph_sensor_component: ezo_ph_uart_component  # EZO pH UART component for calibration and direct readings
  temperature_sensor: water_temperature  # DS18B20 temperature sensor on GPIO3 (WTR_TEMP)
  ec_sensor: ec_sensor                   # TDS/EC sensor (KS0429 via ADC on GPIO0)
  tds_sensor_component: ec_sensor        # TDS sensor component for EC calibration factor (NVS)
  water_level_high_sensor: water_level_high_sensor  # XKC-Y23-V capacitive sensor on GPIO17 (WTR_HI)
  water_level_low_sensor: water_level_low_sensor  # XKC-Y23-V capacitive sensor on GPIO23 (WTR_LO - auto-feed trigger level)
  water_level_empty_sensor: water_level_empty_sensor  # XKC-Y23-V capacitive sensor on GPIO22 (WTR_Empty - minimum safe level)
  time_source: sntp_time  # SNTP time source for clock-based scheduling

  # Actuator GPIO Outputs (Phase 2: Hardware Control - 5 GPIO actuators)
  # NOTE: Using outputs instead of switches to avoid circular dependency
  # Pump Mapping: Grow=NutrientPumpA, Micro=NutrientPumpB, Bloom=NutrientPumpC
  mag_valve_output: mag_valve_output        # GPIO1 - Magnetic valve (fresh water inlet) - MagValve on PCB
  pump_ph_output: pump_ph_output            # GPIO4 - pH pump (acid dosing) - PP_1 on PCB
  pump_grow_output: pump_grow_output        # GPIO5 - Grow pump (NutrientPumpA → nutrient_A_ml_per_liter) - PP_2 on PCB
  pump_micro_output: pump_micro_output      # GPIO6 - Micro pump (NutrientPumpB → nutrient_B_ml_per_liter) - PP_3 on PCB
  pump_bloom_output: pump_bloom_output      # GPIO7 - Bloom pump (NutrientPumpC → nutrient_C_ml_per_liter) - PP_4 on PCB

  # Shelly HTTP Switches (MVP: AirPump, WastewaterPump, GrowLight via Shelly Plus 4PM @ 192.168.0.130)
  air_pump_switch: air_pump_shelly_switch           # Shelly Socket 0 - Air pump for pH mixing
  wastewater_pump_switch: wastewater_pump_shelly_switch  # Shelly Socket 2 - Tank drainage
  grow_light_switch: grow_light_shelly_switch       # Shelly Socket 3 - Grow light

  # ActuatorSafetyGate reference (for state sync on Shelly poll - consolidated HTTP)
  actuator_safety_gate: actuator_safety

  # Tank volumes are per preset: `plantos_controller: presets:` below.

  # Magnetic Valve Flow Rate (for automated water addition)
  # IMPORTANT: Calibrate using 10s test button (even though valve is ON/OFF only)
  mag_valve_flow_rate_ml_s: 100.0    # Magnetic valve: mL/second when OPEN (CALIBRATED 2026-06-06: 300mL/3s)

  # Pump Calibration Configuration (flow rates and PWM intensities)
  # IMPORTANT: Update these values after calibration using 10s test buttons
  # Formula: flow_rate_ml_s = (measured_mL) / 10
  # Pump Mapping: Grow=NutrientPumpA, Micro=NutrientPumpB, Bloom=NutrientPumpC
  pump_ph_flow_rate_ml_s: 2.35        # pH pump: mL/second @ configured PWM (CALIBRATED 2026-06-06: 23.5mL/10s @ 100%)
  pump_ph_pwm_intensity: 100%        # pH pump: PWM intensity (0-100%, CALIBRATED: 100%@5V)
  pump_grow_flow_rate_ml_s: 1.75     # Grow pump (NutrientPumpA): mL/second @ configured PWM (CALIBRATED 2026-06-06: 17.5mL/10s @ 100%)
  pump_grow_pwm_intensity: 100%      # Grow pump (NutrientPumpA): PWM intensity (0-100%, CALIBRATED: 100%@5V)
  pump_micro_flow_rate_ml_s: 0.75    # Micro pump (NutrientPumpB): mL/second @ configured PWM (CALIBRATED 2026-06-06: 7.5mL/10s @ 100%)
  pump_micro_pwm_intensity: 100%     # Micro pump (NutrientPumpB): PWM intensity (0-100%, CALIBRATED: 100%@5V)
  pump_bloom_flow_rate_ml_s: 0.75    # Bloom pump (NutrientPumpC): mL/second @ configured PWM (CALIBRATED 2026-06-06: 7.5mL/10s @ 100%)
  pump_bloom_pwm_intensity: 100%     # Bloom pump (NutrientPumpC): PWM intensity (0-100%, CALIBRATED: 100%@5V)
  # PWM sliders (number entities): their restored value overrides the intensities above
  # at boot, and every change applies at once (it does not switch the pump on)
  pump_ph_pwm_number: pwm_gpio4_slider
  pump_grow_pwm_number: pwm_gpio5_slider
  pump_micro_pwm_number: pwm_gpio6_slider
  pump_bloom_pwm_number: pwm_gpio7_slider

  # pH Reading Configuration
  ph_reading_interval: 2h     # How often to check pH (default: 2 hours)
  ph_min: 5.5                  # Lower pH threshold (default: 5.5)
  ph_max: 6.2                  # Upper pH threshold (default: 6.2)
                               # If pH is outside this range, controller will
                               # transition to PH_PROCESSING state and decide
                               # whether to start pH correction

################################################################################
# PlantOS Unified Controller (Layer 1) - Phase 8
#
# Unified controller managing:
# - System FSM with 12 states
# - LED behaviors via LedBehaviorSystem
# - HAL integration for sensors/LED
# - SafetyGate integration for actuators
# - StatusLogger (owned internally, not injected)
# - PSM integration for crash recovery
#
# Architecture: Controller → SafetyGate → HAL → Hardware
################################################################################
alert_service:
  id: alerts

plantos_controller:
  id: unified_controller
  hal: hal                       # Hardware abstraction layer
  safety_gate: actuator_safety   # Actuator control with safety enforcement
  persistence: psm               # Persistent state manager for crash recovery
  calendar: plant_calendar       # Calendar manager for grow schedule and nutrient dosing
  time_source: sntp_time         # NTP time source for automatic day calculation
  alert_service: alerts          # Alert dispatching (log backend; future: Telegram, HA)
  ph_k_factor_number: ph_k_factor_slider  # EMA K-factor updates are published to this slider

  # Night Mode Configuration
  night_mode_enabled: true      # Night mode enabled by default (22:00–09:00)
  night_mode_start_hour: 22     # Hour when night mode starts (0-23, default: 22 = 10 PM)
  night_mode_end_hour: 9        # Hour when night mode ends (0-23, default: 9 = 9 AM)
                                # During night mode: no pH correction, feeding, or water filling

  # Status Logger Configuration
  enable_status_reports: false  # Enable/disable periodic status reports (default: false, use "System Status Reports" switch)
  status_report_interval: 60s   # How often to print status reports (default: 30s)
  verbose_mode: false           # Enable instant verbose logging of all events (default: false)
                                # Verbose mode logs state changes, sensor readings, and actuator
                                # commands in real-time without waiting for periodic reports.
                                # Note: LED changes are automatically filtered out.
  enable_420_mode: true         # Enable 420 easter egg at 4:20 AM/PM (default: true)
                                # When enabled, displays ASCII art in status logs at 4:20

  # pH Dosing K-Factor
  # dose_ml = (current_pH - 5.85) × tank_L × K
  # Increase if pH corrections are too small; decrease if overdosing.
  # The EMA learning will refine this value automatically over time.
  ph_k_factor: 0.25

  # Runtime presets (FSMINFO.md "Presets"). The active preset is chosen in the web UI ("Preset"
  # select) and kept in NVS; first boot of this firmware = Haupt. Each preset uses the calendar of
  # the same name (calendar_manager: calendars:) with its own grow day.
  # These are the DEFAULTS, the one place in YAML for them. The web UI entities "Tank Volume
  # LOW→HIGH", "Tank Volume EMPTY→HIGH" and "Function ..." edit the active preset; once a preset
  # was edited there, its NVS record wins over these lines (reflashing does not reset it).
  #   tank_volume_delta_liters: LOW -> HIGH sensor (daily feed dose, acid dose, mixing time)
  #   total_tank_volume_liters: EMPTY -> HIGH sensor (reservoir change dose)
  #   functions: hardware the preset has. pH measurement + correction (probe, acid pump) always.
  #     nutrients  = pumps A/B/C (feeding, EC feeding, mother mix)
  #     water_fill = water valve + level sensors (fill, top-up, feed fill)
  #     drain      = wastewater pump, Shelly 2 (empty tank, reservoir change)
  #     air_pump   = Shelly 0 (aeration; without it pH/EC mixing settles by time only)
  #     grow_light = Shelly 3 (light schedule)
  presets:
    haupt:                              # production tank
      tank_volume_delta_liters: 27.4    # LOW -> HIGH | 57x37x13cm = 27.417L
      total_tank_volume_liters: 47.5    # EMPTY -> HIGH | 57x37x22.5cm = 47.498L
      functions: [nutrients, water_fill, drain, air_pump, grow_light]
    mutter:                             # PLACEHOLDER volumes (plan/TO_MEASURE.md)
      tank_volume_delta_liters: 10.0
      total_tank_volume_liters: 15.0
      functions: [nutrients, water_fill, drain]
    anzucht:                            # PLACEHOLDER volumes and functions (plan/TO_MEASURE.md)
      tank_volume_delta_liters: 5.0
      total_tank_volume_liters: 8.0
      functions: []                     # pH only
  # pH / EC mixing time in a preset without air pump = normal time x this factor (max 20 min).
  # PLACEHOLDER (plan/TO_MEASURE.md).
  no_air_pump_settle_factor: 2.0

# Actuator Safety Gate (Layer 2) - Debouncing, Duration Limits, Soft-Start/Stop
# See components/actuator_safety_gate/README.md for complete documentation.
actuator_safety_gate:
  id: actuator_safety
  hal: hal  # Phase 2: Inject HAL dependency for hardware control
  # Max ON time per actuator: a longer request is rejected, a longer run is reported.
  max_durations:
    WaterValve: 600s       # 10 min - water fill max
    AcidPump: 30s          # pH dosing (covers PH_MAX_DOSE_ML=10mL at lowered flow rate)
    NutrientPumpA: 120s    # nutrient A (large doses at peak grow days)
    NutrientPumpB: 120s    # nutrient B
    NutrientPumpC: 120s    # nutrient C
    AirPump: 0s            # 0 = unlimited (24/7 operation)
    WastewaterPump: 1800s  # 30 min - slow pump
  # Air pump cycling periods set at boot; cycling itself starts OFF (Normal mode 24/7).
  # The "Air Pump Cycling" switch turns it on with the "Air Pump ON/OFF Period" numbers.
  air_pump_cycling:
    on_period: 120s
    off_period: 60s

################################################################################
# EZO pH Sensor Component via I2C (Atlas Scientific)
#
# Production pH sensor using I2C communication with Atlas Scientific EZO circuit.
# Default I2C address: 0x61.
#
# Hardware Requirements:
# - Atlas Scientific EZO pH Circuit (UART mode)
# - pH probe (included with EZO kit)
# - UART connection to ESP32-C6 (TX=GPIO18, RX=GPIO19 via uart_bus)
# - ADUM1201 isolator: one channel per direction (TX→EZO, EZO→RX)
#
# Calibration:
# - Use ESPHome API services to calibrate (see api section)
# - Mid-point: pH 7.00 buffer solution (required first)
# - Low-point: pH 4.00 buffer solution (optional)
# - High-point: pH 10.00 buffer solution (optional)
#
# Temperature Compensation:
# - Configure temperature_compensation parameter below
# - Links to a temperature sensor for improved accuracy
# - Improves accuracy from ±0.1 pH to ±0.02 pH
#
# UART Protocol Details:
# - ASCII text commands terminated with \r
# - 300ms response delay required after each command (handled internally)
# - Baud rate: 9600
################################################################################
ezo_ph_uart:
  id: ezo_ph_uart_component
  uart_id: uart_bus
  update_interval: 5s
  verbose: false
  ph:
    name: "Nutrient Solution pH"
    id: ph_sensor_real
    accuracy_decimals: 2
    web_server:
      sorting_group_id: sg_sensors
      sorting_weight: 10
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - lambda: |-
          if (x < 0.0 || x > 14.0) {
            ESP_LOGW("ezo_ph_uart", "pH value out of typical range: %.2f", x);
            return {};
          }
          return x;

  temperature_compensation: water_temperature

################################################################################
# Persistent State Manager - NVS-Based Critical Event Logging
#
# Manages critical event persistence across power cycles and crashes.
# Essential for operations that could cause damage if interrupted:
# - Chemical dosing (acid/base pumps)
# - Watering/valve operations
# - Calibration sequences
# - Any long-running critical process
#
# Features:
# - NVS (Non-Volatile Storage) persistence survives power loss
# - Time-based event age validation (requires NTP sync)
# - Recovery detection on boot
# - Atomic save/load operations
#
# Usage Example:
#   // Before starting critical operation
#   id(psm).logEvent("DOSING_ACID", 0);  // Status 0 = STARTED
#   turnOnAcidPump();
#
#   // After completing operation
#   turnOffAcidPump();
#   id(psm).clearEvent();  // Clear - operation completed
#
#   // On boot - check for recovery
#   if (id(psm).wasInterrupted(60)) {  // Within last 60 seconds
#       // Take recovery action (turn off pumps, etc.)
#   }
################################################################################
persistent_state_manager:
  id: psm

################################################################################
# WDT Manager - Hardware Watchdog Timer Management
#
# Manages the ESP32 hardware watchdog timer (WDT) to detect and recover from
# system hangs or crashes. The WDT must be regularly "fed" to indicate the
# system is healthy. If feeding stops, the WDT automatically resets the device.
#
# Features:
# - Hardware WDT initialization with 10-second timeout
# - Regular WDT feeding every 500ms during normal operation
# - Test mode: Simulates crash after 20 seconds to verify automatic reset
# - Non-blocking operation using millis() timing
#
# Configuration:
# - timeout: WDT timeout period (10 seconds)
# - feed_interval: How often to feed WDT (500ms)
# - test_mode: Enable crash simulation (true for testing)
# - crash_delay: Time before simulated crash (20 seconds)
#
# Expected Behavior (Test Mode):
# 1. Boot: "WDT initialized successfully"
# 2. 0-20s: Regular "WDT fed" messages every 500ms
# 3. 20s: "SIMULATED CRASH - Stopping WDT feeding"
# 4. ~30s: WDT timeout triggers automatic reboot
# 5. Device reboots and cycle repeats
#
# For Production: Set test_mode: false to disable crash simulation
################################################################################
wdt_manager:
  id: my_wdt
  timeout: 20s           # WDT timeout: 20 seconds (increased for 15s HTTP timeout)
  feed_interval: 500ms   # Feed WDT every 500 milliseconds
  test_mode: false        # Enable crash simulation for testing
  crash_delay: 20s       # Simulate crash after 20 seconds

################################################################################
# CalendarManager - Daily Schedule Management for 120-Day Grow Cycle
#
# Manages target pH values and nutrient dosing durations for each day.
# Current day is persisted to NVS and survives power cycles.
################################################################################
calendar_manager:
  id: plant_calendar

  # Safe mode: Disable automated time-based routines (manual control still works)
  safe_mode: false

  # Verbose mode: Enable detailed logging of all operations
  verbose: false

  # Status log interval: How often to report current day and schedule
  status_log_interval: 10min

  # Grow calendars, one per preset (anzucht, mutter, haupt; all three required).
  # A calendar is a list of phases. A phase applies from `from_day` until the next
  # phase starts; after the last phase its values apply forever (hold the last phase).
  # Checked at build time (components/calendar_manager/phase_tables.py): phases sorted,
  # first phase at day 1, no duplicate from_day, ph_min < ph_max, values in sane ranges.
  # Changing a calendar needs a reflash.
  #   days:            planned length, only for display ("day 69/120"); omit = open-ended
  #   name:            optional phase label (max 32 bytes)
  #   ph_min/ph_max:   pH target window
  #   dose_X_ml_per_L: nutrient dose per liter of tank volume (A = Grow, B = Micro, C = Bloom)
  #   light_on_time / light_off_time: "HH:MM" (quote it) or minutes since midnight;
  #                    on == off means "no light window" (night mode uses its hour window)
  #   ec_target / ec_tolerance: mS/cm; ec_target 0 = EC feeding off
  calendars:
    # PLACEHOLDER (plan/TO_MEASURE.md): propagation, based on Haupt's first days.
    # The default Anzucht setup has no nutrient pumps, so phase 1 doses nothing;
    # phase 2 only matters if the nutrient pumps are enabled for Anzucht.
    anzucht:
      days: 21
      phases:
        - from_day: 1
          name: "Keimung"
          ph_min: 5.8
          ph_max: 6.2
          dose_A_ml_per_L: 0.0
          dose_B_ml_per_L: 0.0
          dose_C_ml_per_L: 0.0
          light_on_time: "16:00"
          light_off_time: "08:00"
          ec_target: 0.0
          ec_tolerance: 0.1
        - from_day: 8
          name: "Bewurzelung"
          ph_min: 5.8
          ph_max: 6.2
          dose_A_ml_per_L: 0.4
          dose_B_ml_per_L: 0.4
          dose_C_ml_per_L: 0.4
          light_on_time: "16:00"
          light_off_time: "08:00"
          ec_target: 0.5
          ec_tolerance: 0.1

    # PLACEHOLDER (plan/TO_MEASURE.md): mother plant, one endless vegetative phase,
    # based on Haupt days 24-28 with a moderate EC and 18 h light. Mutter has no grow
    # light; the light window still defines "night" for night mode.
