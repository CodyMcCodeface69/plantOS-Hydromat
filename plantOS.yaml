################################################################################
switch:
  # === Air Pump Control ===
  - platform: template
    id: air_pump_cycling_switch
    name: "Air Pump Cycling"
    restore_mode: RESTORE_DEFAULT_OFF  # Default to Normal mode (24/7 ON)
    optimistic: true
    icon: "mdi:air-purifier"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 40
    turn_on_action:
      # Cycling with the periods from the "Air Pump ON/OFF Period" numbers
      - lambda: id(unified_controller)->setAirPumpCycling(true, id(air_pump_on_period).state, id(air_pump_off_period).state);
    turn_off_action:
      # Normal mode: air pump 24/7 ON
      - lambda: id(unified_controller)->setAirPumpCycling(false, id(air_pump_on_period).state, id(air_pump_off_period).state);

  # === Safety Gate Control ===
  - platform: template
    id: safety_gate_enabled
    name: "Enable Actuator Safety Gate"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON  # Safety gate enabled by default
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 80
    turn_on_action:
      - lambda: id(actuator_safety)->setEnabled(true);
    turn_off_action:
      - lambda: id(actuator_safety)->setEnabled(false);

  # === Automatic EC/Feeding Control ===
  - platform: template
    id: auto_feeding_enabled_switch
    name: "Auto EC/Feeding Correction"
    icon: "mdi:flask-plus"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 120
    restore_mode: RESTORE_DEFAULT_ON  # Auto-feeding enabled by default
    optimistic: false  # State determined by lambda return value
    # The controller setter stores the value in NVS and logs it
    turn_on_action:
      - lambda: id(unified_controller)->setAutoFeedingEnabled(true);
    turn_off_action:
      - lambda: id(unified_controller)->setAutoFeedingEnabled(false);
    # Cached value (loaded from NVS at setup); never call loadState() here
    lambda: return id(unified_controller)->isAutoFeedingEnabled();

  # === Automatic Weekly Reservoir Change Control ===
  - platform: template
    id: auto_reservoir_change_enabled_switch
    name: "Auto Reservoir Change"
    icon: "mdi:calendar-sync"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 90
    restore_mode: RESTORE_DEFAULT_OFF  # Disabled by default (manual control preferred)
    optimistic: false  # State determined by lambda return value
    # The controller setter stores the value in NVS and logs it
    turn_on_action:
      - lambda: id(unified_controller)->setAutoReservoirChangeEnabled(true);
    turn_off_action:
      - lambda: id(unified_controller)->setAutoReservoirChangeEnabled(false);
    # Cached value (loaded from NVS at setup); never call loadState() here
    lambda: return id(unified_controller)->isAutoReservoirChangeEnabled();

  # === Auto pH Correction Toggle ===
  - platform: template
    id: auto_ph_correction_switch
    name: "Auto pH Correction"
    icon: "mdi:flask-outline"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 110
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: false
    # The controller setter stores the value in NVS and logs it
    turn_on_action:
      - lambda: id(unified_controller)->setAutoPhCorrectionEnabled(true);
    turn_off_action:
      - lambda: id(unified_controller)->setAutoPhCorrectionEnabled(false);
    # Cached value (loaded from NVS at setup); never call loadState() here
    lambda: return id(unified_controller)->isAutoPhCorrectionEnabled();

  # === Auto Water Level Toggle ===
  - platform: template
    id: auto_water_level_switch
    name: "Auto Water Level"
    icon: "mdi:water-auto"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 130
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: false
    # The controller setter stores the value in NVS and logs it
    turn_on_action:
      - lambda: id(unified_controller)->setAutoFillEnabled(true);
    turn_off_action:
      - lambda: id(unified_controller)->setAutoFillEnabled(false);
    # Cached value (loaded from NVS at setup); never call loadState() here
    lambda: return id(unified_controller)->isAutoFillEnabled();

  # === 10 - Actuator Control (Manual Toggle Switches via Safety Gate) ===
  # These switches toggle actuators through the safety gate for monitored control
  # Safety gate will auto-shutoff if max duration exceeded
  # Note: optimistic=true, switches show intended state (not actual hardware state)
  - platform: template
    id: mag_valve_switch
    name: "Magnetic Valve"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 10
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("WaterValve", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("WaterValve", false);

  - platform: template
    id: pump_ph_switch
    name: "pH Pump"
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 20
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("AcidPump", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("AcidPump", false);

  # Nutrient Pump Switches (Grow = NutrientPumpA, Micro = NutrientPumpB, Bloom = NutrientPumpC)
  - platform: template
    id: pump_grow_switch
    name: "Grow Pump"    # NutrientPumpA → nutrient_A_ml_per_liter (GPIO5, PP_2)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 30
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpA", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpA", false);

  - platform: template
    id: pump_micro_switch
    name: "Micro Pump"   # NutrientPumpB → nutrient_B_ml_per_liter (GPIO6, PP_3)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 40
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpB", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpB", false);

  - platform: template
    id: pump_bloom_switch
    name: "Bloom Pump"   # NutrientPumpC → nutrient_C_ml_per_liter (GPIO7, PP_4)
    optimistic: true
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 50
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpC", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("NutrientPumpC", false);

  # Shelly integration on/off (runtime). OFF: no polling, Shelly commands dropped,
  # WastewaterPump forced OFF first; tank drain and reservoir change are refused.
  # Polling runs in a HAL worker task (every 30s), not in an interval.
  - platform: template
    name: "Shelly Integration"
    id: shelly_integration_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:power-socket-eu"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 5
    turn_on_action:
      - lambda: id(hal).setShellyEnabled(true);
    turn_off_action:
      - lambda: id(hal).setShellyEnabled(false);

  # === Shelly-Controlled Actuators (Shelly Plus 4PM @ 192.168.0.130) ===
  # AirPump on Socket 0, WastewaterPump on Socket 2, GrowLight on Socket 3
  # Socket 1 reserved for future expansion
  # Uses ASG for debouncing based on actual Shelly state (polled every 5s)

  # Air pump via Shelly Plus 4PM Socket 0
  - platform: template
    id: air_pump_shelly_switch
    name: "Air Pump"
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 60
    # Actual state from the HAL (synced by the Shelly poll)
    lambda: return id(hal).getShellySwitchState(0);
    # Through the safety gate, which debounces against the actual Shelly state
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("AirPump", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("AirPump", false);

  # Wastewater pump via Shelly Plus 4PM Socket 2
  - platform: template
    id: wastewater_pump_shelly_switch
    name: "Wastewater Pump"
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 70
    # Actual state from the HAL (synced by the Shelly poll)
    lambda: return id(hal).getShellySwitchState(2);
    # Through the safety gate, which debounces against the actual Shelly state
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("WastewaterPump", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("WastewaterPump", false);

  # Grow light via Shelly Plus 4PM Socket 3
  - platform: template
    id: grow_light_shelly_switch
    name: "Grow Light"
    restore_mode: ALWAYS_OFF
    web_server:
      sorting_group_id: sg_actuators
      sorting_weight: 80
    # Actual state from the HAL (synced by the Shelly poll)
    lambda: return id(hal).getShellySwitchState(3);
    # Through the safety gate, which debounces against the actual Shelly state
    turn_on_action:
      - lambda: id(unified_controller)->commandActuator("GrowLight", true);
    turn_off_action:
      - lambda: id(unified_controller)->commandActuator("GrowLight", false);

  # === pH Sensor Control ===
  - platform: template
    name: "Continuous pH Reading"
    id: continuous_ph_reading_switch
    optimistic: true
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 180
    turn_on_action:
      - lambda: id(ezo_ph_uart_component)->enable_continuous_reading();
    turn_off_action:
      - lambda: id(ezo_ph_uart_component)->disable_continuous_reading();

  # === Night Mode Configuration ===

  - platform: template
    name: "Night Mode"
    id: night_mode_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:weather-night"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 10
    # No pH correction, feeding or filling during night hours
    turn_on_action:
      - lambda: id(unified_controller)->setNightModeConfig(true, id(night_start_hour).state, id(night_end_hour).state);
    turn_off_action:
      - lambda: id(unified_controller)->setNightModeConfig(false, id(night_start_hour).state, id(night_end_hour).state);

  # === Grow Light Schedule Control ===
  # When enabled, the controller will automatically control the grow light based on the calendar schedule.
  # When disabled (default), use Shelly scripts for direct light cycle control - more fail-proof.

  - platform: template
    name: "Grow Light Schedule"
    id: grow_light_schedule_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:lightbulb-auto"
    web_server:
      sorting_group_id: sg_controller_settings
      sorting_weight: 70
    turn_on_action:
      - lambda: id(unified_controller)->setGrowLightScheduleEnabled(true);
    turn_off_action:
      - lambda: id(unified_controller)->setGrowLightScheduleEnabled(false);

